[pytest]
testpaths = tests
cache_dir = .pytest_cache
# NOTE: tests/test_erp.py is ignored because it targets the removed legacy prototype schema
# (_legacy models: StoreLocation, Worker with employee_id, quantity column, and legacy 'app.py' imports).
# All relevant business logic, role guards, storage integrity, yarn sufficiency, and lifecycle cases
# have been ported to the active test suite (test_step2.py, test_storage_integrity.py, test_dispatch_invoice.py,
# test_order_progress.py, test_yarn_traceability.py, test_costing_and_financial_summary.py,
# test_step7_consistency.py, and test_e2e_chain_proof.py).
addopts = --ignore=tests/test_erp.py

